name: Verificar entrega
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Ejecutar pruebas
        run: npm test
      - name: Compilar aplicación
        run: npm run build
      - name: Preparar captura del caso de prueba
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          (npm run start > /tmp/taller-norte.log 2>&1 & echo $! > /tmp/taller-norte.pid)
          for i in $(seq 1 40); do
            if curl --fail --silent http://localhost:3000/bitacora > /dev/null; then break; fi
            sleep 2
          done
          node scripts/capture.mjs
        env:
          DATABASE_URL: file:local.db
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        with:
          name: captura-bitacora
          path: evidencia/bitacora.png
