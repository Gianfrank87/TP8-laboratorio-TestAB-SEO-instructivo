name: Verificar entrega
on:
  push:
    branches: [main]
    paths-ignore:
      - 'capturas/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Ejecutar pruebas
        run: npm test
      - name: Compilar aplicación
        run: npm run build
      - name: Capturar landing y bitácora
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/capture.mjs
        env:
          CAPTURE_BASE_URL: https://tp8-laboratorio-testab-seo-instruct.vercel.app
      - name: Subir capturas al repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capturas/landing.png capturas/bitacora.png
          if ! git diff --cached --quiet; then
            git commit -m "Agregar capturas de la landing y la bitácora"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: capturas-tp8
          path: capturas/*.png
